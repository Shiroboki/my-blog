server {
    listen 80;
    server_name _;
    absolute_redirect off;

    client_max_body_size 50m;

    # 开启 Gzip 压缩，显著减小 JS / CSS / JSON / SVG / XML 传输体积
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/xml
        application/json
        application/javascript
        application/xml
        application/xml+rss
        application/rss+xml
        image/svg+xml;

    # 管理后台静态资源（vue3-element-admin，VITE_BASE_URL=/admin/）
    location = /admin {
        return 301 /admin/;
    }

    location /admin/assets/ {
        alias /usr/share/nginx/html/admin/assets/;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location /admin/ {
        alias /usr/share/nginx/html/admin/;
        index index.html;
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /admin/index.html;
    }

    # 管理后台生产代理前缀 /prod-api -> 后端根路径
    location /prod-api/ {
        proxy_pass http://backend:8000/;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # 前台博客接口与 Swagger 文档
    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # RSS 订阅与 Sitemap
    location = /rss.xml {
        proxy_pass http://backend:8000/api/v1/blog/public/rss.xml;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /sitemap.xml {
        proxy_pass http://backend:8000/api/v1/blog/public/sitemap.xml;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 本地上传图片静态访问
    location /uploads/ {
        proxy_pass http://backend:8000/uploads/;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 带内容哈希的构建产物长效强缓存
    location /assets/ {
        root /usr/share/nginx/html/web;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location = /favicon.ico {
        alias /usr/share/nginx/html/web/favicon.svg;
        types { }
        default_type image/svg+xml;
        add_header Cache-Control "public, max-age=604800";
    }

    # 博客前台（Vue 3 SPA，入口 HTML 禁用强制缓存确保发版即时生效）
    location / {
        root /usr/share/nginx/html/web;
        index index.html;
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
