name: myblog

services:
  mysql:
    image: mysql:8.0.29
    container_name: myblog-mysql
    restart: unless-stopped
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_0900_ai_ci
    environment:
      TZ: Asia/Shanghai
      LANG: en_US.UTF-8
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-123456}
    volumes:
      - myblog_mysql_data:/var/lib/mysql
      - ./backend/sql/youlai-admin.sql:/docker-entrypoint-initdb.d/01-youlai-admin.sql:ro
      - ./backend/sql/extensions/blog.sql:/docker-entrypoint-initdb.d/02-blog.sql:ro
    ports:
      - "${MYSQL_PORT:-13306}:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - myblog_net

  redis:
    image: redis:7.2.3
    container_name: myblog-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-123456} --appendonly yes --protected-mode no
    environment:
      TZ: Asia/Shanghai
      REDISCLI_AUTH: ${REDIS_PASSWORD:-123456}
    volumes:
      - myblog_redis_data:/data
    ports:
      - "${REDIS_PORT:-16379}:6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - myblog_net

  backend:
    image: maven:3.9.9-eclipse-temurin-17
    container_name: myblog-backend
    restart: unless-stopped
    working_dir: /app
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      TZ: Asia/Shanghai
      SPRING_PROFILES_ACTIVE: docker
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: youlai_admin
      DB_USER: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD:-123456}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-123456}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-SecretKey012345678901234567890123456789012345678901234567890123456789}
      STORAGE_TYPE: local
      STORAGE_LOCAL_PATH: /app/uploads/
    volumes:
      - ./backend/target/youlai-boot.jar:/app/app.jar:ro
      - myblog_uploads:/app/uploads
    command:
      - sh
      - -c
      - java ${JAVA_OPTS:--Xms256m -Xmx512m} -Djava.security.egd=file:/dev/./urandom -jar /app/app.jar
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/api/v1/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - myblog_net

  nginx:
    image: nginx:alpine
    container_name: myblog-nginx
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./web/dist:/usr/share/nginx/html/web:ro
      - ./admin/dist:/usr/share/nginx/html/admin:ro
    ports:
      - "${WEB_PORT:-9123}:80"
    networks:
      - myblog_net

volumes:
  myblog_mysql_data:
  myblog_redis_data:
  myblog_uploads:

networks:
  myblog_net:
    driver: bridge
